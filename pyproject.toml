[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videa-uploader"
version = "0.2.0"
description = "Unofficial Videa video uploader and SRT attachment client"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40,<2",
    "beautifulsoup4>=4.12,<5",
    "python-dotenv>=1,<2",
]
keywords = ["videa", "upload", "subtitles", "playwright"]

[project.scripts]
videa-uploader = "videa_uploader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
